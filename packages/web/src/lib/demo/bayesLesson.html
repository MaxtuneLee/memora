<style>
  .bx-steps {
    display: flex;
    gap: 14px;
    font-size: 13px;
    color: var(--color-text-tertiary);
    margin: 4px 0 12px;
  }
  .bx-steps .on {
    color: var(--color-text-primary);
  }
  .bx-model {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 4fr);
    gap: 24px;
    align-items: center;
  }
  .bx-grid {
    display: grid;
    grid-template-columns: repeat(40, 1fr);
    gap: 1.5px;
  }
  .bx-grid i {
    display: block;
    aspect-ratio: 1;
    border-radius: 1.5px;
    background: var(--color-border-tertiary);
  }
  .bx-grid i.tp {
    background: var(--color-text-danger);
  }
  .bx-grid i.fp {
    background: var(--color-text-warning);
    opacity: 0.6;
  }
  .bx-key {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 13px;
    color: var(--color-text-secondary);
    margin: 0 0 14px;
  }
  .bx-key span::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: -1px;
    background: var(--sw);
  }
  .bx-control {
    display: block;
    margin: 0 0 12px;
    font-size: 14px;
  }
  .bx-control div {
    display: flex;
    justify-content: space-between;
    color: var(--color-text-secondary);
  }
  .bx-control output {
    color: var(--color-text-primary);
    font-variant-numeric: tabular-nums;
  }
  .bx-control input {
    width: 100%;
  }
  .bx-result {
    border-top: 1px solid var(--color-border-tertiary);
    padding-top: 12px;
    font-size: 14px;
    color: var(--color-text-secondary);
  }
  .bx-result strong {
    display: block;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--color-text-primary);
    font-variant-numeric: tabular-nums;
  }
  .bx-card {
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 12px 14px;
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.6;
  }
  #quiz:not(:empty) {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border-tertiary);
  }
</style>
<div class="bx-steps">
  <span id="st1" class="on">1 Explore</span><span>·</span><span id="st2">2 Check</span><span>·</span
  ><span id="st3">3 Result</span>
</div>
<div class="bx-model">
  <div id="grid" class="bx-grid"></div>
  <div>
    <div class="bx-key">
      <span style="--sw: var(--color-text-danger)">Sick, tests positive</span
      ><span style="--sw: var(--color-text-warning)">Healthy, tests positive</span>
    </div>
    <label class="bx-control" for="base">
      <div>Base rate <output id="baseOut">1%</output></div>
      <input id="base" type="range" min="0.5" max="30" step="0.5" value="1" />
    </label>
    <label class="bx-control" for="fpr">
      <div>False positive rate <output id="fprOut">9%</output></div>
      <input id="fpr" type="range" min="1" max="20" step="1" value="9" />
    </label>
    <div class="bx-result">
      Sick if positive
      <strong id="post">9%</strong>
      <span id="counts"></span>
    </div>
  </div>
</div>
<div id="explore" class="bx-card"></div>
<div id="quiz"></div>
<script>
  const el = (id) => document.getElementById(id);
  const SENS = 0.9;
  const state = { stage: "explore", task: 0, base: 1, fpr: 9 };
  const cells = [];
  for (let i = 0; i < 1000; i++) {
    const c = document.createElement("i");
    el("grid").appendChild(c);
    cells.push(c);
  }
  let seed = 7;
  const rand = () => {
    seed = (seed * 16807) % 2147483647;
    return seed / 2147483647;
  };
  const order = cells.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const model = () => {
    const sick = Math.round(state.base * 10);
    const tp = Math.round(sick * SENS);
    const fp = Math.round(((1000 - sick) * state.fpr) / 100);
    return { sick, tp, fp, post: tp / Math.max(1, tp + fp) };
  };
  const tasks = [
    {
      text: "Drag the base rate up to 10% and watch the chance of being sick if positive.",
      done: () => state.base >= 10,
      why: "More sick people means more true positives next to the same false alarms, so the posterior climbs to about half.",
    },
    {
      text: "Set the base rate back to 1%, then lower the false positive rate to 1%.",
      done: () => state.base <= 1 && state.fpr <= 1,
      why: "Cutting false alarms works too: with a rare disease, the healthy majority is where most positives come from.",
    },
  ];
  const render = () => {
    const m = model();
    let tpLeft = m.tp,
      fpLeft = m.fp;
    cells.forEach((c) => {
      c.className = "";
    });
    order.forEach((idx) => {
      if (tpLeft > 0) {
        cells[idx].className = "tp";
        tpLeft--;
      } else if (fpLeft > 0) {
        cells[idx].className = "fp";
        fpLeft--;
      }
    });
    el("baseOut").textContent = `${state.base}%`;
    el("fprOut").textContent = `${state.fpr}%`;
    el("post").textContent = `${Math.round(m.post * 100)}%`;
    el("counts").textContent = `${m.tp} of ${m.tp + m.fp} positives are sick`;
    const ex = el("explore");
    if (state.stage !== "explore") {
      ex.style.display = "none";
      return;
    }
    const t = tasks[state.task];
    if (!t) {
      ex.innerHTML = "";
      const b = document.createElement("button");
      b.textContent = "Check my understanding";
      b.onclick = () => {
        state.stage = "check";
        el("st1").className = "";
        el("st2").className = "on";
        render();
        quiz.start();
      };
      ex.appendChild(b);
      return;
    }
    if (t.done()) {
      ex.innerHTML = `<div style="color:var(--color-text-success)">${t.why}</div>`;
      const b = document.createElement("button");
      b.textContent = "Next";
      b.style.marginTop = "10px";
      b.onclick = () => {
        state.task++;
        render();
      };
      ex.appendChild(b);
      return;
    }
    ex.innerHTML = `<div>Task ${state.task + 1} of ${tasks.length}: ${t.text}</div>`;
    const s = document.createElement("button");
    s.textContent = "Skip";
    s.style.cssText =
      "margin-top:8px;border:none;background:none;padding:0;color:var(--color-text-secondary)";
    s.onclick = () => {
      state.task++;
      render();
    };
    ex.appendChild(s);
  };
  el("base").oninput = (e) => {
    state.base = Number(e.target.value);
    render();
  };
  el("fpr").oninput = (e) => {
    state.fpr = Number(e.target.value);
    render();
  };
  const quiz = lesson.quiz(el("quiz"), {
    title: "Bayes' theorem · Lesson check",
    onResult: () => {
      el("st2").className = "";
      el("st3").className = "on";
    },
  });
  quiz.choice({
    concept: "Predictive value at a low base rate",
    prompt:
      "1% of people have the disease, the test catches 90% of cases, and 9% of healthy people test positive. If you test 1,000 people at random, about what share of those who test positive are actually sick?",
    answer: "About 9%",
    wrong: [
      {
        text: "About 90%",
        why: "That is the sensitivity: how many sick people test positive, not how many positives are sick.",
      },
      {
        text: "About 1%",
        why: "That is the base rate before testing. A positive result raises it.",
      },
      {
        text: "About 50%",
        why: "The false alarms from 990 healthy people far outnumber the 9 real cases.",
      },
    ],
    why: "9 true positives against about 89 false alarms: 9 of 98, about 9%.",
  });
  quiz.choice({
    concept: "Base rate drives predictive value",
    prompt:
      "Keep sensitivity at 90% and the false positive rate at 9%. With the base rate at 10%, how likely is a positive test to be right?",
    setup: {
      prompt: "First, set Base rate to 10% and False positive rate to 9% on the model above.",
      check: () => Math.abs(state.base - 10) <= 0.5 && state.fpr === 9,
    },
    answer: "About 53%",
    wrong: [
      { text: "About 33%", why: "Read it off the model: 90 of 171 positives are sick." },
      {
        text: "About 10%",
        why: "That is the base rate itself, not the share of positives that are real.",
      },
      {
        text: "About 90%",
        why: "That is the sensitivity. Positives still include about 81 false alarms.",
      },
    ],
    why: "90 true positives and 81 false alarms: 90 of 171, about 53%.",
  });
  quiz.choice({
    concept: "Fewer false alarms",
    prompt:
      "True or false: with a 1% base rate and 90% sensitivity, lowering the false positive rate from 9% to 1% raises the chance that a positive test is right.",
    answer: "True",
    wrong: [
      {
        text: "False",
        why: "Fewer false alarms means a bigger share of the positives are real cases.",
      },
    ],
    why: "False alarms drop from about 89 to about 10, so about half of the positives become real.",
  });
  quiz.multi({
    concept: "Sensitivity versus predictive value",
    prompt:
      "A test has 90% sensitivity and a 9% false positive rate, and the base rate is 1%. Which statements are true?",
    answers: [
      "About 90% of people who are sick test positive",
      "Among people who test positive, more are sick than in the population",
      "About 9% of healthy people test positive",
    ],
    wrong: [
      {
        text: "About 90% of people who test positive are sick",
        why: "That swaps sensitivity for predictive value. Only about 9% of positives are sick.",
      },
    ],
    why: "Sensitivity and the false positive rate describe the test. The share of positives that are sick (9%) is still well above the 1% base rate.",
  });
  quiz.choice({
    concept: "Limits of a low base rate",
    prompt:
      "True or false: even at a 1% base rate, with 90% sensitivity and a low enough false positive rate, a positive test can be right more than 90% of the time.",
    answer: "True",
    wrong: [
      {
        text: "False",
        why: "A low base rate only holds the result down while false alarms outnumber real cases. Make them rare enough and it passes 90%.",
      },
    ],
    why: "Below about a 0.1% false positive rate, fewer than 1 healthy person in 1,000 tests positive, so the 9 real cases dominate.",
  });
  render();
</script>
