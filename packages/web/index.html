<!doctype html>
<html lang="en">
  <head>
    <script type="module">
      if (import.meta.env.DEV) {
        import("react-grab");
        import("@react-grab/mcp/client");
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/memora-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Memora is a local-first multimodal learning and memory workspace."
    />
    <meta name="theme-color" content="#fcfaf6" />
    <!-- Resolves the first-frame theme before any styles paint. Keep the key and colors in sync
         with src/lib/theme/documentTheme.ts; LiveStore corrects a stale value after startup. -->
    <script id="theme-bootstrap">
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem("memora-theme");
        } catch (error) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#1b1a17" : "#fcfaf6");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Memora</title>
  </head>
  <body>
    <div id="root" class="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
