<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local index E2E</title>
    <style>
      :root {
        color: #172033;
        background: #f4f6fb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        box-sizing: border-box;
        width: min(960px, 100%);
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #dbe1ec;
        border-radius: 16px;
        background: white;
        box-shadow: 0 16px 48px rgb(25 42 70 / 8%);
      }

      h1 {
        margin: 0 0 16px;
        font:
          600 22px/1.3 system-ui,
          sans-serif;
      }

      #status {
        margin: 0 0 16px;
        color: #53627a;
      }

      #status[data-state="passed"] {
        color: #167447;
      }

      #status[data-state="failed"] {
        color: #b42318;
      }

      pre {
        overflow: auto;
        margin: 0;
        padding: 16px;
        border-radius: 10px;
        background: #111827;
        color: #e5e7eb;
        line-height: 1.55;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local vector index E2E</h1>
      <p id="status" data-state="running">Running…</p>
      <pre id="result" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/dev-pages/local-index-e2e.ts"></script>
  </body>
</html>
