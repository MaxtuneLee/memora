packages:
  - packages/*
  - packages/*/*

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  react-grab: true
  sharp: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

overrides:
  vite: "catalog:"

patchedDependencies:
  "@lexical/markdown@0.44.0": patches/@lexical__markdown@0.44.0.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
