packages:
  - packages/*
  - packages/*/*

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  react-grab: true
  sharp: true
  workerd: true

catalog:
  vite: npm:vite@latest
  vite-plus: 0.1.13
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.14

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
